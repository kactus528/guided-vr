<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Guided VR Emotional Reprocessing</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e9edf6; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    #hud button { pointer-events: auto; background: #2a3350; color: #e9edf6; border: 1px solid #3c4a75; border-radius: 10px;
      padding: 9px 14px; font-size: 15px; cursor: pointer; }
    #hud button.primary { background: #4d7cff; border-color: #6b93ff; }
    #hud .hint { margin-left: auto; font-size: 13px; color: #8a96b3; pointer-events: none; }
    #hud.presenting .hint { display: none; }
    #recIndicator { pointer-events: none; background: rgba(255,77,94,.18); border: 1px solid #ff4d5e; color: #ff9aa5;
      border-radius: 10px; padding: 8px 12px; font-size: 14px; }
    #recIndicator::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #ff4d5e;
      border-radius: 50%; margin-right: 8px; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    #noVR { font-size: 13px; color: #8a96b3; pointer-events: none; }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(20,24,40,.95);
      border: 1px solid #3c4a75; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #textModal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
    #textModal .box { background: #121829; border: 1px solid #3c4a75; border-radius: 14px; padding: 20px; width: min(640px, 92vw); }
    #textModal label { display: block; color: #9aa6c0; font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
    #textModal textarea { width: 100%; box-sizing: border-box; height: 160px; background: #0b0f1a; color: #e9edf6;
      border: 1px solid #3c4a75; border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; resize: vertical; }
    #textModal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    #textModal button { background: #2a3350; color: #e9edf6; border: 1px solid #3c4a75; border-radius: 10px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
    #textModal button.primary { background: #4d7cff; border-color: #6b93ff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <button id="btnVR" class="primary" style="display:none">Enter VR</button>
    <button id="btnGround">Ground (G)</button>
    <button id="btnRecenter">Recenter (R)</button>
    <span id="recIndicator" style="display:none">Recording</span>
    <span id="noVR" style="display:none">Desktop preview — WebXR VR not detected</span>
    <span class="hint">Click panels · drag to look · Space pauses · Esc/G grounds</span>
  </div>
  <div id="toast"></div>
  <div id="textModal">
    <div class="box">
      <label id="textLabel" for="textArea"></label>
      <textarea id="textArea" placeholder="Type as much or as little as you like"></textarea>
      <div class="row">
        <button id="textCancel">Cancel</button>
        <button id="textSave" class="primary">Save</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
